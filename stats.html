<!doctype html>
<html lang="fr" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Statistiques — TaxiMeter</title>
    <meta name="theme-color" content="#f5b400" />
    <script>
      try { if (localStorage.getItem('taximeter.theme') === 'dark') document.documentElement.dataset.theme = 'dark'; } catch (e) {}
    </script>
    <link rel="stylesheet" href="css/style.css" />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%23f5b400'/><text x='16' y='21' font-family='Arial' font-size='12' font-weight='800' text-anchor='middle' fill='%231b1b1f'>TX</text></svg>" />
  </head>
  <body>
    <header id="site-header"></header>
    <main>
      <h1 class="page-title">Statistiques</h1>
      <div id="stats-empty" class="card empty-state hidden">
        Le suivi des courses arrivera plus tard (enregistrement et comptes utilisateurs).<br /><a href="index.html">Estimer une course</a>
      </div>
      <div id="stats-content" class="hidden">
        <div class="stats-grid">
          <div class="stat"><div class="label">Courses</div><div class="value" id="stat-count">0</div></div>
          <div class="stat"><div class="label">Montant total</div><div class="value" id="stat-revenue">—</div></div>
          <div class="stat"><div class="label">Prix moyen</div><div class="value" id="stat-avg">—</div></div>
          <div class="stat"><div class="label">Distance totale</div><div class="value" id="stat-km">—</div></div>
        </div>
        <p class="hint" id="stat-split" style="margin:-4px 0 14px"></p>
        <section class="card">
          <div class="card-head"><h2>Dernières courses</h2></div>
          <div class="table-wrap">
            <table class="data-table">
              <thead><tr><th>Date</th><th>Trajet</th><th class="num">km</th><th>Tarif</th><th class="num">Prix</th></tr></thead>
              <tbody id="stat-rows"></tbody>
            </table>
          </div>
        </section>
        <button type="button" class="btn btn-block" id="stats-clear">Effacer l’historique</button>
        <p class="hint" style="text-align:center">Données stockées sur cet appareil uniquement, en attendant la base en ligne.</p>
      </div>
    </main>
    <footer id="site-footer"></footer>
    <script type="module" src="js/ui/layout.js"></script>
    <script type="module" src="js/pages/stats.js"></script>
  </body>
</html>
