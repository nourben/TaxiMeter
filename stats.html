<!doctype html>
<html lang="fr" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Statistiques — TaxiMeter</title>
    <meta name="theme-color" content="#f5b400" />
    <script>
      try { if (localStorage.getItem('taximeter.theme') === 'dark') document.documentElement.dataset.theme = 'dark'; } catch (e) {}
    </script>
    <link rel="stylesheet" href="css/style.css" />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%23f5b400'/><text x='16' y='21' font-family='Arial' font-size='12' font-weight='800' text-anchor='middle' fill='%231b1b1f'>TX</text></svg>" />
  </head>
  <body>
    <header id="site-header"></header>
    <main>
      <h1 class="page-title">Statistiques</h1>

      <section class="card" aria-labelledby="h-chart">
        <div class="card-head">
          <div>
            <h2 id="h-chart">Estimations réalisées</h2>
            <p class="muted small" id="chart-caption" style="margin:2px 0 0"></p>
          </div>
        </div>

        <div class="segmented seg-sm chart-switch" role="radiogroup" aria-label="Période" id="granularity"></div>

        <div class="stat-row" id="stat-row"></div>

        <div class="chart" id="chart" role="img" aria-labelledby="h-chart chart-caption"></div>
        <div class="chart-tip hidden" id="chart-tip" role="status"></div>

        <details class="chart-table">
          <summary>Voir le tableau</summary>
          <table class="data-table"><thead><tr><th>Période</th><th class="num">Estimations</th></tr></thead><tbody id="chart-rows"></tbody></table>
        </details>

        <p class="demo-note hidden" id="demo-note">Données fictives pour l’aperçu : les vrais chiffres arriveront avec Supabase.</p>
      </section>
    </main>
    <footer id="site-footer"></footer>
    <script type="module" src="js/ui/layout.js"></script>
    <script type="module" src="js/pages/stats.js"></script>
  </body>
</html>
