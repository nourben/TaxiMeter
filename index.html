<!doctype html>
<html lang="fr" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>TaxiMeter — Estimer le prix d’une course</title>
    <meta name="description" content="Estimez le prix d’une course de taxi : distance, tarif jour/nuit, supplément Métropole." />
    <meta name="theme-color" content="#f5b400" />
    <script>
      try { if (localStorage.getItem('taximeter.theme') === 'dark') document.documentElement.dataset.theme = 'dark'; } catch (e) {}
    </script>
    <link rel="stylesheet" href="css/style.css" />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%23f5b400'/><text x='16' y='21' font-family='Arial' font-size='12' font-weight='800' text-anchor='middle' fill='%231b1b1f'>TX</text></svg>" />
  </head>
  <body>
    <header id="site-header"></header>

    <main>
      <div class="title-row switch-row">
        <h1 class="page-title">Estimer une course</h1>
        <div class="mode-opt">
          <button type="button" class="mode-switch" id="optimized-toggle" role="switch" aria-checked="false">
            <span class="mode-label">Itinéraire<br /> optimisé</span>
            <span class="switch-track" aria-hidden="true"><span class="switch-thumb"></span></span>
          </button>
          <button class="info-btn" data-info="optimise" aria-label="Aide sur l’itinéraire optimisé">i</button>
        </div>
      </div>

      <form id="fare-form" novalidate autocomplete="off" onsubmit="return false">
        <section class="card" aria-labelledby="h-trips">
          <div class="card-head">
            <h2 id="h-trips">Trajet</h2>
            <button class="info-btn" data-info="trajet" aria-label="Aide sur les trajets">i</button>
          </div>
          <div id="trips"></div>
          <div class="add-row">
            <button type="button" class="link-btn link-add" id="add-trip">+ Ajouter un trajet</button>
            <span class="muted small hidden" id="trip-limit"></span>
          </div>
        </section>

        <section class="card result" aria-live="polite" aria-labelledby="h-price">
          <div class="result-total">
            <h2 id="h-price">Prix estimé</h2>
            <div class="price" id="price-total">—</div>
          </div>
          <p class="hint hidden" id="price-note"></p>
          <p class="shared-row hidden" id="shared-row">
            <strong>Transport partagé</strong><small id="shared-detail"></small>
          </p>
          <div id="price-list"><p class="empty-state">Indiquez la distance pour obtenir le prix.</p></div>
        </section>

        <p style="text-align:center;margin:0">
          <button type="button" class="link-btn" id="reset-form">Tout effacer</button>
        </p>
      </form>
    </main>

    <footer id="site-footer"></footer>
    <div class="toast" id="toast" role="status" aria-live="polite"></div>

    <script type="module" src="js/ui/layout.js"></script>
    <script type="module" src="js/pages/calculator.js"></script>
  </body>
</html>
